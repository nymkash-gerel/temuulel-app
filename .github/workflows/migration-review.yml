name: Migration Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  # Three parallel sessions once claimed the same migration number in separate
  # worktrees; nothing caught it until a local replay failed. The pull_request
  # checkout is the merge ref, so files from main AND the branch are both
  # present — a branch reusing a number main already merged fails right here.
  duplicate-numbers:
    name: No duplicate migration numbers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fail on colliding numeric prefixes
        run: |
          DUPES=$(ls supabase/migrations/*.sql | xargs -n1 basename | grep -oE '^[0-9]+' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate migration number(s): $(echo $DUPES | tr '\n' ' ')"
            for n in $DUPES; do ls supabase/migrations/ | grep -E "^${n}_"; done
            exit 1
          fi
          echo "OK: no duplicate migration numbers."

  migration-diff:
    name: Post Migration Diff
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get new migration files
        id: migrations
        run: |
          FILES=$(git diff --name-only --diff-filter=A origin/main...HEAD -- 'supabase/migrations/*.sql')
          if [ -z "$FILES" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "files<<EOF" >> "$GITHUB_OUTPUT"
            echo "$FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Build comment body
        if: steps.migrations.outputs.found == 'true'
        id: comment
        run: |
          BODY="## Migration Review\n\n"
          BODY+="The following migration files are new in this PR:\n\n"
          while IFS= read -r file; do
            BODY+="\`\`\`sql\n"
            BODY+="-- $file\n"
            BODY+="$(cat "$file")\n"
            BODY+="\`\`\`\n\n"
          done <<< "${{ steps.migrations.outputs.files }}"
          BODY+="### Checklist\n"
          BODY+="- [ ] Migration is idempotent or has been tested with \`supabase db reset\`\n"
          BODY+="- [ ] Rollback plan documented (see \`-- ROLLBACK:\` comment in SQL)\n"
          BODY+="- [ ] Applied to staging first (\`workflow_dispatch\` → staging)\n"
          BODY+="- [ ] Types regenerated (\`npm run gen:types\`)\n"

          # Write to file to avoid escaping issues
          echo -e "$BODY" > /tmp/comment.md

      - name: Post comment on PR
        if: steps.migrations.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: migration-review
          path: /tmp/comment.md
