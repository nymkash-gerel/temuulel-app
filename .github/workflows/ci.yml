name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: placeholder
  SUPABASE_SECRET_KEY: placeholder
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
  OPENAI_API_KEY: placeholder
  FACEBOOK_APP_SECRET: placeholder
  FACEBOOK_PAGE_ACCESS_TOKEN: placeholder
  MESSENGER_VERIFY_TOKEN: placeholder
  TELEGRAM_BOT_TOKEN: placeholder
  DRIVER_TELEGRAM_BOT_TOKEN: placeholder
  SENTRY_DSN: https://placeholder@sentry.io/0
  UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
  UPSTASH_REDIS_REST_TOKEN: placeholder

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npx eslint src/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit --skipLibCheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npx vitest run src/ --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Next.js Build
        run: npx next build

  slack-on-failure:
    name: Slack notify on CI failure
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Post failure to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret not set — skipping"
            exit 0
          fi
          SHORT_SHA="${SHA:0:7}"
          FIRST_LINE=$(printf '%s' "$COMMIT_MSG" | head -n1)
          jq -n \
            --arg sha "$SHORT_SHA" \
            --arg msg "$FIRST_LINE" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg run "$RUN_URL" \
            '{
              text: ("❌ CI failed on main — " + $sha),
              attachments: [{
                color: "#d72b3f",
                blocks: [
                  { type: "header", text: { type: "plain_text", text: "❌ CI failed on main" } },
                  { type: "section", text: { type: "mrkdwn", text: ("*<" + $run + "|" + $sha + ">* — " + $msg) } },
                  { type: "context", elements: [
                      { type: "mrkdwn", text: ("👤 " + $actor + " · 📦 " + $repo) }
                    ]
                  }
                ]
              }]
            }' > /tmp/payload.json
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data @/tmp/payload.json \
            "$SLACK_WEBHOOK_URL"
